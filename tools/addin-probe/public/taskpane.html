<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QExcel probe</title>
	<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
	<script src="functions.js"></script>
	<style>
		body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 12px; color: #1f1f1f; background: #fff; }
		h1 { font-size: 15px; margin: 0 0 8px; }
		h2 { font-size: 13px; margin: 14px 0 6px; }
		button { display: block; width: 100%; margin: 4px 0; padding: 6px 8px; text-align: left; font: inherit;
		         border: 1px solid #c8c8c8; border-radius: 4px; background: #f6f6f6; cursor: pointer; }
		button:disabled { opacity: .5; cursor: default; }
		button.primary { background: #217346; color: #fff; border-color: #217346; }
		label { display: block; margin: 4px 0; }
		input { width: 100%; box-sizing: border-box; font: inherit; padding: 3px; }
		#status { margin: 8px 0; padding: 6px; background: #f0f6f2; border-radius: 4px; min-height: 1.2em; }
		#log { white-space: pre-wrap; font: 11px ui-monospace, Menlo, monospace; background: #fafafa;
		       border: 1px solid #e5e5e5; padding: 6px; max-height: 320px; overflow: auto; }
		.note { color: #555; font-size: 12px; }
	</style>
</head>
<body>
	<h1>QExcel — зонд фазы 0</h1>
	<div class="note">Отчёт сохраняется автоматически после каждого эксперимента в <code>tools/addin-probe/reports/</code>.</div>
	<label>Адрес демона <input id="daemon" value="http://127.0.0.1:47321"></label>
	<div id="status">Загрузка…</div>

	<button id="run-all" class="primary">Запустить всё (кроме 500 тыс.)</button>

	<h2>По отдельности</h2>
	<button data-run="environment">1. Окружение и наборы API</button>
	<button data-run="connectivity">2. Связь с демоном (fetch, CORS, preflight)</button>
	<button data-run="write10k">3a. Запись в таблицу: 10 тыс. строк</button>
	<button data-run="write100k">3b. Запись в таблицу: 100 тыс. строк</button>
	<button data-run="chunks">3c. Предел размера порции записи</button>
	<button data-run="write500k">3d. Запись в таблицу: 500 тыс. строк (долго)</button>
	<button data-run="refresh">4. Обновление таблицы: resize, стиль, вычисляемая колонка</button>
	<button data-run="injection">5. Формулы в данных: =, +, -, @</button>
	<button data-run="dates">6. Система дат книги</button>
	<button data-run="functions">7. Пользовательские функции: пустые ячейки, LATE, META</button>

	<h2>Кэш метаданных функций (проверка 9)</h2>
	<button data-run="metaSwitch">8a. Переключить метаданные на вариант 2</button>
	<button data-run="metaCheck">8b. Проверить, видит ли Excel PROBE.NEW</button>
	<button data-run="metaReset">8c. Вернуть вариант 1</button>
	<div class="note">После 8a: закройте и снова откройте панель → 8b. Затем полностью перезапустите Excel → снова 8b.</div>

	<h2>Журнал</h2>
	<div id="log"></div>

	<script src="taskpane.js"></script>
</body>
</html>
