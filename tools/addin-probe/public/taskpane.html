<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QExcel probe</title>
	<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
	<script src="functions.js"></script>
	<style>
		body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 12px; color: #1f1f1f; background: #fff; }
		h1 { font-size: 15px; margin: 0 0 8px; }
		h2 { font-size: 13px; margin: 14px 0 6px; }
		button { display: block; width: 100%; margin: 4px 0; padding: 6px 8px; text-align: left; font: inherit;
		         border: 1px solid #c8c8c8; border-radius: 4px; background: #f6f6f6; cursor: pointer; }
		button:disabled { opacity: .5; cursor: default; }
		button.primary { background: #217346; color: #fff; border-color: #217346; }
		label { display: block; margin: 4px 0; }
		input { width: 100%; box-sizing: border-box; font: inherit; padding: 3px; }
		#status { margin: 8px 0; padding: 6px; background: #f0f6f2; border-radius: 4px; min-height: 1.2em; }
		#log { white-space: pre-wrap; font: 11px ui-monospace, Menlo, monospace; background: #fafafa;
		       border: 1px solid #e5e5e5; padding: 6px; max-height: 320px; overflow: auto; }
		.note { color: #555; font-size: 12px; }
	</style>
</head>
<body>
	<h1>QExcel — phase 0 probe</h1>
	<div class="note">The report is saved automatically after each experiment to <code>tools/addin-probe/reports/</code>.</div>
	<label>Daemon address <input id="daemon" value="http://127.0.0.1:47321"></label>
	<div id="status">Loading…</div>

	<button id="run-all" class="primary">Run all (except 500k)</button>

	<h2>One at a time</h2>
	<button data-run="environment">1. Environment and API sets</button>
	<button data-run="connectivity">2. Daemon connectivity (fetch, CORS, preflight)</button>
	<button data-run="write10k">3a. Table write: 10k rows</button>
	<button data-run="write100k">3b. Table write: 100k rows</button>
	<button data-run="chunks">3c. Write chunk size limit</button>
	<button data-run="write500k">3d. Table write: 500k rows (slow)</button>
	<button data-run="refresh">4. Table refresh: resize, style, calculated column</button>
	<button data-run="injection">5. Formulas in data: =, +, -, @</button>
	<button data-run="dates">6. Workbook date system</button>
	<button data-run="functions">7. Custom functions: empty cells, LATE, META</button>

	<h2>Function metadata cache (check 9)</h2>
	<button data-run="metaSwitch">8a. Switch metadata to variant 2</button>
	<button data-run="metaCheck">8b. Check whether Excel sees PROBE.NEW</button>
	<button data-run="metaReset">8c. Restore variant 1</button>
	<div class="note">After 8a: close and reopen the task pane → 8b. Then fully restart Excel → 8b again.</div>

	<h2>Log</h2>
	<div id="log"></div>

	<script src="taskpane.js"></script>
</body>
</html>
