<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QExcel</title>
	<!-- Office.js has to come from Microsoft's CDN; everything else is served with the page. -->
	<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
	<style>
		:root { --text: #1f1f1f; --muted: #616161; --line: #e0e0e0; --bg: #ffffff;
		        --ok: #217346; --warning: #8a5a00; --error: #a4262c; }
		body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--text); background: var(--bg); }
		main { padding: 12px; }
		.status { position: sticky; top: 0; padding: 6px 12px; border-bottom: 1px solid var(--line);
		          color: var(--muted); background: var(--bg); }
		.status::before { content: "●"; margin-right: 6px; }
		.status[data-tone="ok"]::before { color: var(--ok); }
		.status[data-tone="warning"]::before { color: var(--warning); }
		.status[data-tone="error"]::before { color: var(--error); }
		.status[data-tone="error"] { color: var(--error); }
		h2 { font-size: 13px; margin: 4px 0 8px; }
		button { font: inherit; padding: 3px 10px; border: 1px solid #c8c8c8; border-radius: 4px;
		         background: #f6f6f6; color: var(--text); cursor: pointer; }
		button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
		button:disabled { opacity: .5; cursor: default; }
		.note { color: var(--muted); }
		.problem { color: var(--error); margin: 4px 0; }
		.warning { color: var(--warning); margin: 4px 0; }
		/* Environment colours (SPEC.md §3.1): the same wherever a connection is shown. */
		[data-environment="DEV"] { --env: #0f6cbd; }
		[data-environment="TEST"] { --env: #a35200; }
		[data-environment="PROD"] { --env: #c50f1f; }
		.connection { border: 1px solid var(--line); border-left: 4px solid var(--env); border-radius: 4px;
		              padding: 8px; margin-bottom: 8px; }
		.connection .title { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
		.connection .environment { color: #fff; background: var(--env); border-radius: 3px; padding: 0 5px;
		                           font-size: 11px; font-weight: 600; }
		.connection .host { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
		.connection .state { color: var(--muted); margin: 4px 0; }
		.connection .state.ok { color: var(--ok); }
		.connection .signing-in { color: var(--warning); margin: 4px 0; }
		.connection .actions { display: flex; gap: 6px; margin-top: 6px; }
		details.add summary { cursor: pointer; color: var(--ok); margin: 4px 0; }
		form label { display: block; margin: 6px 0; color: var(--muted); }
		form input, form select { display: block; width: 100%; box-sizing: border-box; margin-top: 2px;
		                          font: inherit; padding: 3px; color: var(--text); }
		section.query, section.bound { margin-top: 16px; }
		/* The trust dialog (CONTRACTS.md §9.3): over the whole pane until it is answered. */
		.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .35); overflow: auto; }
		.overlay[hidden] { display: none; }
		.dialog { background: var(--bg); margin: 12px; padding: 12px; border-radius: 6px; }
		.trust-query { border-top: 1px solid var(--line); padding: 8px 0; }
		.trust-query .environment { color: #fff; background: var(--env); border-radius: 3px; padding: 0 5px;
		                            font-size: 11px; font-weight: 600; margin-left: 4px; }
		pre.sql { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px ui-monospace, Menlo, monospace;
		          background: #f6f6f6; border: 1px solid var(--line); border-radius: 4px; padding: 6px;
		          max-height: 240px; overflow: auto; }
		.dialog .actions { display: flex; gap: 6px; margin-top: 10px; }
		.binding { border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 4px;
		           padding: 8px; margin-bottom: 8px; }
		.binding .title { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
		.binding .host { color: var(--muted); font-size: 12px; }
		.binding .state { color: var(--muted); margin: 4px 0; }
		.binding .signing-in { color: var(--warning); margin: 4px 0; }
		.binding .actions { display: flex; gap: 6px; margin-top: 6px; }
		h3 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); }
		.toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
		.toolbar h2 { margin: 0; flex: 1; }
		.segments { display: inline-flex; }
		.segments button { border-radius: 0; }
		.segments button:first-child { border-radius: 4px 0 0 4px; }
		.segments button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
		.segments button.selected { background: var(--text); color: #fff; border-color: var(--text); }
		.connection-select { font: inherit; flex: 1; min-width: 0; }
		.label { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
		.label .environment, .preview th small { font-size: 11px; }
		.label .environment { color: #fff; background: var(--env); border-radius: 3px; padding: 0 5px; font-weight: 600; }
		.editor { border: 1px solid var(--line); border-radius: 4px; }
		.editor .cm-editor { height: 220px; font-size: 12px; }
		.editor .cm-scroller { font-family: ui-monospace, Menlo, monospace; }
		.param { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; margin: 4px 0; }
		.param .name { grid-column: 1 / -1; }
		.param .name small { color: var(--muted); }
		.param input, .param select { font: inherit; padding: 2px; min-width: 0; }
		.param .cell { display: flex; gap: 4px; }
		.param .cell input { flex: 1; }
		.param.undeclared { border-left: 3px solid var(--warning); padding-left: 6px; }
		.preview .grid { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 4px; }
		.preview table { border-collapse: collapse; font-size: 12px; }
		.preview th, .preview td { border-bottom: 1px solid var(--line); padding: 2px 6px; text-align: left;
		                           white-space: nowrap; }
		.preview th { position: sticky; top: 0; background: #f6f6f6; }
		.preview th small { display: block; color: var(--muted); font-weight: normal; }
		.preview pre { white-space: pre-wrap; font: 11px ui-monospace, Menlo, monospace; }
		.save input.project { font: inherit; padding: 2px; width: 90px; }
		.save-status.ok { color: var(--ok); }
	</style>
</head>
<body>
	<div id="status" class="status" role="status" data-tone="pending">Connecting to ofexceld…</div>
	<!-- Office's pane title already says QExcel. -->
	<main></main>
	<script src="taskpane.js"></script>
</body>
</html>
